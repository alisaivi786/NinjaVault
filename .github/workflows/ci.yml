name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, test, pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore NinjaVault.slnx --locked-mode

      - name: Format check
        run: dotnet format NinjaVault.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build NinjaVault.slnx -c Release -warnaserror --no-restore

      - name: Test
        run: dotnet test NinjaVault.slnx -c Release --no-build

      - name: Change-set check
        run: bash scripts/check-changesets.sh

      - name: Pack
        run: |
          for project in src/*/*.csproj; do
            dotnet pack "$project" -c Release --no-build -p:ContinuousIntegrationBuild=true
          done

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/
          if-no-files-found: error
